<!DOCTYPE html>
<html>
<head>
  <title>aIrrange - All Conversations</title>
  <!-- The CSS is now in an external file -->
  <link rel="stylesheet" type="text/css" href="all.css">
</head>
<body>
  <div class="page">
    <div style="display:flex; gap: 18px; align-items:flex-start;">
      <aside id="sidebar" style="width: 260px; position: sticky; top: 18px;">
        <div style="border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); border-radius: 14px; padding: 12px;">
          <div style="font-weight: 700; margin-bottom: 10px;">Quick Filter</div>
          <div id="tag-sidebar" style="display:flex; flex-wrap:wrap; gap: 8px;"></div>
        </div>
      </aside>

      <main style="flex: 1; min-width: 0;">
    <div class="topbar">
      <div class="title">Conversation Dashboard</div>
      <div class="search">
        <input type="search" id="search-bar" placeholder="Search title, summary, or tags…">
      </div>
    </div>

  <details>
    <summary>Settings</summary>
    <div class="settingsRow">
      <select id="api-provider-select">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
      </select>

      <input type="password" id="api-key-input" placeholder="API key for selected provider">
      <button id="test-api-key">Test</button>
      <button id="save-api-key">Save</button>
    </div>

    <div class="settingsRow" style="margin-top: 10px;">
      <select id="model-selector" disabled hidden style="flex: 1; min-width: 240px;"></select>
    </div>
    <p id="api-key-status" style="text-align:center; font-size: 12px;"></p>

    <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 14px 0;" />

    <div style="text-align:center; font-weight: 700; margin-bottom: 8px;">Export</div>
    <div class="settingsRow">
      <button id="export-md-zip">Export as Markdown (ZIP)</button>
      <button id="export-csv">Export as CSV</button>
    </div>

    <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 14px 0;" />

    <div style="text-align:center; font-weight: 700; margin-bottom: 8px;">Danger Zone</div>
    <div class="settingsRow">
      <button id="clear-history" style="background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.35);">Clear All History</button>
    </div>
  </details>

  <ul id="all-conversations-list" class="cards"></ul>
  <script type="module" src="all.js"></script>
      </main>
    </div>
  </div>
</body>
</html>
